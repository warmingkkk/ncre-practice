services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请在.env中设置管理员初始密码}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-ncre_practice_session}
    volumes:
      - practice-data:/app/data
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  practice-data:
