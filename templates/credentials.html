{% extends 'base.html' %}{% block content %}<h1>账号已就绪</h1><p class="notice">学生初始或重置密码为123456；班主任等账号的随机初始密码仅此页显示，请及时保存。所有账号首次登录或重置后必须修改密码。</p><button id="print">打印 / 保存为 PDF</button> <a class="text-link" href="{{back}}">返回</a><div class="panel table-wrap"><table><thead><tr><th>姓名</th><th>登录账号</th><th>初始密码</th></tr></thead><tbody>{% for c in credentials %}<tr><td>{{c.name}}</td><td>{{c.username}}</td><td><code>{{c.password}}</code></td></tr>{% else %}<tr><td colspan="3">没有新增账号，已有学生已跳过。</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
