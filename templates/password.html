{% extends 'base.html' %}{% block content %}<h1>账号设置</h1><p class="muted">首次登录请设置自己的密码，至少 10 位。</p><form method="post" class="panel stack narrow"><input type="hidden" name="csrf" value="{{ csrf }}"><label>原密码<input type="password" name="old" required autocomplete="current-password"></label><label>新密码<input type="password" name="password" minlength="10" required autocomplete="new-password"></label><button>保存密码</button></form>{% endblock %}
