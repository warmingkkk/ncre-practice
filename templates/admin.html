{% extends 'base.html' %}{% block content %}<h1>系统管理</h1><h2>账号管理</h2><div class="panel table-wrap"><table><thead><tr><th>账号</th><th>姓名</th><th>角色</th><th>操作</th></tr></thead><tbody>{% for u in users %}<tr><td>{{u.username}}</td><td>{{u.name}}</td><td>{{roles[u.role]}}</td><td><form action="/users/{{u.id}}/reset" method="post" data-confirm="确认重置密码？"><input type="hidden" name="csrf" value="{{csrf}}"><button class="text-button">重置密码</button></form></td></tr>{% endfor %}</tbody></table></div><h2>最近操作记录</h2><div class="panel">{% for l in logs %}<p><span class="muted">{{l.created|replace('T',' ')}}</span> · {{l.name}} · {{l.action}}</p>{% else %}<p class="muted">暂无操作记录</p>{% endfor %}</div>{% endblock %}
