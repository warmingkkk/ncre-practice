{% extends 'base.html' %}{% block content %}<h1>修改班级</h1><p class="muted">修改名称不影响学生和成绩。修改班主任账号后，班主任需使用新账号和原密码重新登录。</p><form method="post" class="panel stack"><input type="hidden" name="csrf" value="{{csrf}}"><label>班级名称<input name="name" maxlength="100" required value="{{form.get('name',classroom.name)}}"></label><label>班主任姓名<input name="teacher" maxlength="80" required value="{{form.get('teacher',teacher.name)}}"></label><label>班主任登录账号<input name="username" maxlength="100" required value="{{form.get('username',teacher.username)}}"></label><div><button>保存修改</button><a class="text-link" href="/classes/{{classroom.id}}">返回班级</a></div></form>{% endblock %}
