{% extends 'base.html' %}{% block content %}<h1>新建班级与班主任账号</h1>{% if error %}<p class="notice" role="alert">{{error}}</p>{% endif %}<form class="panel stack" method="post" action="/classes" data-session-form data-uid="{{current.id}}" autocomplete="off"><input type="hidden" name="csrf" value="{{csrf}}"><p data-session-message role="status" class="muted"></p><label>班级名称<input name="name" maxlength="100" value="{{form.get('name','')}}" required></label><label>班主任姓名<input name="teacher" maxlength="80" value="{{form.get('teacher','')}}" required></label><label>班主任登录账号<input name="username" maxlength="100" value="{{form.get('username','')}}" autocomplete="off" required></label><label>班主任初始密码（可留空自动生成）<input name="initial_password" type="password" minlength="10" maxlength="128" autocomplete="new-password"></label><div><button>创建班级和班主任账号</button><a class="text-link" href="/">返回首页</a></div></form>{% endblock %}
